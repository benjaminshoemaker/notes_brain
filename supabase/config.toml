project_id = "notes_brain"

[api]
enabled = true
port = 65421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 65422
shadow_port = 65420
major_version = 17

[studio]
enabled = true
port = 65423
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 65424

[auth]
site_url = "https://notes-brain-web.vercel.app"
additional_redirect_urls = [
  "https://notes-brain-web.vercel.app",
  "https://notes-brain-web.vercel.app/*",
  "echo://auth/callback"
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
max_frequency = "1m0s"
otp_length = 8

[functions.classify-note]
verify_jwt = true

[functions.transcribe-voice]
verify_jwt = true

[functions.generate-summary]
verify_jwt = true

[functions.send-push]
verify_jwt = true

[functions.execute-lens]
verify_jwt = false

[functions.dispatch-lenses]
verify_jwt = false
